# GitHub Actions：构建并推送 EvalScope Docker 镜像到 GHCR + 阿里云 ACR
#
# 触发：push 到 main / 手动 workflow_dispatch / 打 tag v*
# 产物：
#   - GHCR:        ghcr.io/<owner>/evalscope:<tag>
#   - 阿里云 ACR:  registry.cn-shanghai.aliyuncs.com/luckfu/evalscope:<tag>
#     （需要仓库设置里配置 secrets：ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD）
#   - main 分支：  latest + <sha7>
#   - tag vX.Y.Z： X.Y.Z + latest
#
# 注意：官方 runner 磁盘 ~14GB，PREFETCH_DATASETS=true 时内置核心集 ~1GB，
# 全量数据请运行时挂载覆盖 /data/datasets_cache。

name: build-evalscope-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      evalscope_version:
        description: 'EvalScope 版本（默认 1.11.1）'
        required: false
        default: '1.11.1'
      prefetch_datasets:
        description: '是否预取核心数据集（true/false）'
        required: false
        default: 'true'
      prefetch_channel:
        description: '预取通道（ms-first 适配 EvalScope 默认 MS / hf-first）'
        required: false
        default: 'ms-first'

env:
  IMAGE_NAME: evalscope
  ALIYUN_REGISTRY: registry.cn-shanghai.aliyuncs.com
  ALIYUN_REPO: luckfu/evalscope

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          REF="${{ github.ref }}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_BASE="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          ACR_BASE="${ALIYUN_REGISTRY}/${ALIYUN_REPO}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VER="${REF#refs/tags/v}"
            TAGS="${GHCR_BASE}:${VER},${GHCR_BASE}:latest,${ACR_BASE}:${VER},${ACR_BASE}:latest"
          else
            SHA="${{ github.sha }}"
            TAGS="${GHCR_BASE}:latest,${GHCR_BASE}:${SHA:0:7},${ACR_BASE}:latest,${ACR_BASE}:${SHA:0:7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Resolve build args
        id: args
        run: |
          VERSION="${{ github.event.inputs.evalscope_version }}"
          VERSION="${VERSION:-1.11.1}"
          PREFETCH="${{ github.event.inputs.prefetch_datasets }}"
          PREFETCH="${PREFETCH:-true}"
          CHANNEL="${{ github.event.inputs.prefetch_channel }}"
          CHANNEL="${CHANNEL:-ms-first}"
          echo "evalscope_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prefetch_datasets=$PREFETCH" >> "$GITHUB_OUTPUT"
          echo "prefetch_channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 阿里云 ACR 兼容：用 Docker manifest 格式而非 OCI（ACR 不认 oci.empty manifest）
          provenance: false
          sbom: false
          build-args: |
            EVALSCOPE_VERSION=${{ steps.args.outputs.evalscope_version }}
            PREFETCH_DATASETS=${{ steps.args.outputs.prefetch_datasets }}
            PREFETCH_CHANNEL=${{ steps.args.outputs.prefetch_channel }}
            DATASETS_EXTRA=
          cache-from: type=gha
          cache-to: type=gha,mode=max
